<h1>데이터 유형별 시각화 기법 가이드</h1>
<p class="lead">박현우 교수의 <code>vis.hwpark.net</code> 분류 체계에 따라 데이터의 차원과 목적에 맞는 최적의 인코딩을 적용한 시각화 예시입니다.</p>

<section>
  <h2>1. 범주별 크기 및 순위: 막대 차트 (Bar Chart)</h2>
  <p>항목 간의 대소 비교에는 공통 기준선 위의 길이를 활용하는 막대 차트가 가장 높은 지각 정확도를 제공합니다.</p>
  <div data-illustrate="chart" class="chart-container" style="max-width: 640px; margin: 1.5rem 0;">
    <svg viewBox="0 0 500 240" width="100%" height="auto" role="img" aria-label="언어별 선호도 막대 차트">
      <title>프로그래밍 언어별 사용 선호도</title>
      <desc>Python 42%, TypeScript 28%, Rust 18%, Go 12%를 나타내는 수평 막대 차트</desc>
      <!-- X Grid & Labels -->
      <line x1="100" y1="20" x2="100" y2="200" stroke="var(--line, #e2e8f0)" stroke-width="1" />
      <line x1="200" y1="20" x2="200" y2="200" stroke="var(--line, #e2e8f0)" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="300" y1="20" x2="300" y2="200" stroke="var(--line, #e2e8f0)" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="400" y1="20" x2="400" y2="200" stroke="var(--line, #e2e8f0)" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Bars -->
      <g class="bar-group">
        <text x="90" y="52" text-anchor="end" font-size="13" fill="var(--fg, #1e293b)">Python</text>
        <rect x="100" y="35" width="280" height="26" rx="4" fill="var(--accent, #3b82f6)" />
        <text x="390" y="52" font-size="12" font-weight="bold" fill="var(--fg, #1e293b)">42%</text>

        <text x="90" y="97" text-anchor="end" font-size="13" fill="var(--fg, #1e293b)">TypeScript</text>
        <rect x="100" y="80" width="186" height="26" rx="4" fill="var(--accent-muted, #93c5fd)" />
        <text x="296" y="97" font-size="12" font-weight="bold" fill="var(--fg, #1e293b)">28%</text>

        <text x="90" y="142" text-anchor="end" font-size="13" fill="var(--fg, #1e293b)">Rust</text>
        <rect x="100" y="125" width="120" height="26" rx="4" fill="var(--accent-muted, #93c5fd)" />
        <text x="230" y="142" font-size="12" font-weight="bold" fill="var(--fg, #1e293b)">18%</text>

        <text x="90" y="187" text-anchor="end" font-size="13" fill="var(--fg, #1e293b)">Go</text>
        <rect x="100" y="170" width="80" height="26" rx="4" fill="var(--accent-muted, #93c5fd)" />
        <text x="190" y="187" font-size="12" font-weight="bold" fill="var(--fg, #1e293b)">12%</text>
      </g>
      <!-- Baseline -->
      <line x1="100" y1="200" x2="480" y2="200" stroke="var(--fg-muted, #64748b)" stroke-width="1.5" />
      <text x="100" y="218" text-anchor="middle" font-size="11" fill="var(--fg-muted, #64748b)">0%</text>
      <text x="200" y="218" text-anchor="middle" font-size="11" fill="var(--fg-muted, #64748b)">15%</text>
      <text x="300" y="218" text-anchor="middle" font-size="11" fill="var(--fg-muted, #64748b)">30%</text>
      <text x="400" y="218" text-anchor="middle" font-size="11" fill="var(--fg-muted, #64748b)">45%</text>
    </svg>
  </div>
</section>

<section>
  <h2>2. 시작값에서 누계까지: 폭포 차트 (Waterfall Chart)</h2>
  <p>초기값에서 긍정적/부정적 기여 요인을 거쳐 최종 합계에 이르는 과정을 인과적으로 드러냅니다.</p>
  <div data-illustrate="waterfall" class="chart-container" style="max-width: 640px; margin: 1.5rem 0;">
    <svg viewBox="0 0 500 220" width="100%" height="auto" role="img" aria-label="영업 이익 폭포 차트">
      <title>분기별 손익 변화</title>
      <desc>기초 매출 100억, 신규 수주 +40억, 운영비용 -25억, 마케팅 -10억, 최종 영업이익 105억</desc>
      <g font-size="12" fill="var(--fg, #1e293b)" text-anchor="middle">
        <!-- Bars -->
        <rect x="40" y="100" width="60" height="80" fill="var(--fg-muted, #64748b)" rx="2" />
        <text x="70" y="92" font-weight="bold">100</text>
        <text x="70" y="200">기초 매출</text>

        <rect x="130" y="68" width="60" height="32" fill="#10b981" rx="2" />
        <text x="160" y="60" font-weight="bold" fill="#047857">+40</text>
        <text x="160" y="200">신규 수주</text>

        <rect x="220" y="68" width="60" height="20" fill="#ef4444" rx="2" />
        <text x="250" y="60" font-weight="bold" fill="#b91c1c">-25</text>
        <text x="250" y="200">운영비용</text>

        <rect x="310" y="88" width="60" height="8" fill="#ef4444" rx="2" />
        <text x="340" y="80" font-weight="bold" fill="#b91c1c">-10</text>
        <text x="340" y="200">마케팅</text>

        <rect x="400" y="96" width="60" height="84" fill="var(--accent, #3b82f6)" rx="2" />
        <text x="430" y="88" font-weight="bold" fill="var(--accent, #3b82f6)">105</text>
        <text x="430" y="200">영업이익</text>
      </g>
      <line x1="20" y1="180" x2="480" y2="180" stroke="var(--line, #cbd5e1)" stroke-width="1" />
    </svg>
  </div>
</section>
